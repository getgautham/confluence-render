<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      [hidden] { display: none !important; }
      html, body { margin: 0; background: var(--ds-surface-overlay, #fff); }
      body {
        padding: 20px 24px;
        font: 14px/1.5 var(--ds-font-family-body, ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif);
        color: var(--ds-text, #292A2E);
      }
      label.field { display: block; font-size: 12px; font-weight: 600; color: var(--ds-text-subtle, #505258); margin-bottom: 4px; }
      select {
        width: 100%; box-sizing: border-box; padding: 7px 8px; font: inherit;
        color: inherit; background: var(--ds-background-input, #fff);
        border: 1px solid var(--ds-border-input, #8C8F97); border-radius: 3px;
      }
      .check { display: flex; gap: 8px; align-items: flex-start; margin-top: 16px; }
      .check input { margin-top: 3px; }
      .hint { display: block; font-size: 12px; color: var(--ds-text-subtle, #505258); }
      #status { margin: 0 0 12px; color: var(--ds-text-subtle, #505258); }
      #status:empty { display: none; }
      details { margin-top: 20px; font-size: 12px; color: var(--ds-text-subtle, #505258); }
      summary { cursor: pointer; }
      #key-value {
        display: block; margin-top: 6px; padding: 6px 8px; user-select: all; overflow-wrap: anywhere;
        font: 12px/1.5 var(--ds-font-family-code, ui-monospace, SFMono-Regular, Menlo, monospace);
        background: var(--ds-background-neutral, #F0F1F2); border-radius: 3px;
      }
      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
      button { font: inherit; font-weight: 500; padding: 6px 12px; border-radius: 3px; border: 0; cursor: pointer; }
      #cancel { background: transparent; color: var(--ds-text-subtle, #505258); }
      #save { background: var(--ds-background-brand-bold, #1868DB); color: var(--ds-text-inverse, #fff); }
      #save:disabled { opacity: .5; cursor: default; }
    </style>
  </head>
  <body>
    <p id="status"></p>
    <div id="form" hidden>
      <label class="field" for="file">File</label>
      <select id="file"></select>

      <label class="check" id="scripts-row">
        <input type="checkbox" id="scripts" />
        <span>
          Let this HTML run its scripts
          <span class="hint">For charts and buttons. Scripts run in a locked box with no access to Confluence or your login.</span>
        </span>
      </label>

      <details id="key">
        <summary>Key for the Claude plugin</summary>
        <code id="key-value"></code>
      </details>

      <div class="actions">
        <button id="cancel" type="button">Cancel</button>
        <button id="save" type="button">Save</button>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
